apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pedidosapi-hpa
  namespace: NAMESPACE_TAG    # ← placeholder alpha | beta | rc | stable
  labels:
    app: pedidosapi
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pedidosapi
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Pods
        value: 1
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
      - type: Pods
        value: 2
        periodSeconds: 60
