# ── STABLE ────────────────────────────────────────────────────
- stage: DeployStable
  displayName: 'Stable — Produção (aprovação dupla)'
  dependsOn: CI
  condition: >
    and(
      succeeded(),
      startsWith(variables['Build.SourceBranch'], 'refs/tags/v'),
      not(contains(variables['Build.SourceBranch'], '-alpha.')),
      not(contains(variables['Build.SourceBranch'], '-beta.')),
      not(contains(variables['Build.SourceBranch'], '-rc.'))
    )
  variables:
    appVersion: $[ stageDependencies.CI.BuildTestPush.outputs['versao.appVersion'] ]
  jobs:
  - deployment: DeployStable
    displayName: 'Deploy Stable → AKS namespace: stable'
    environment: 'stable'
    strategy:
      runOnce:
        deploy:
          steps:
          - script: echo "appVersion=$(appVersion)"
            displayName: '0. Debug appVersion'

          - task: DownloadPipelineArtifact@2
            displayName: '1. Download manifests k8s'
            inputs:
              artifactName: 'k8s-manifests'
              targetPath: '$(Pipeline.Workspace)/k8s'

          - task: AzureCLI@2
            displayName: '2. Substituir placeholders nos manifests'
            inputs:
              azureSubscription: 'sc-azure-pedidosapi'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                echo "→ Substituindo placeholders para namespace: stable"
                sed -i "s|NAMESPACE_TAG|stable|g"       $(Pipeline.Workspace)/k8s/configmap.yaml
                sed -i "s|NAMESPACE_TAG|stable|g"       $(Pipeline.Workspace)/k8s/deployment.yaml
                sed -i "s|NAMESPACE_TAG|stable|g"       $(Pipeline.Workspace)/k8s/service.yaml
                sed -i "s|NAMESPACE_TAG|stable|g"       $(Pipeline.Workspace)/k8s/hpa.yaml
                sed -i "s|IMAGE_TAG|$(appVersion)|g"    $(Pipeline.Workspace)/k8s/deployment.yaml
                sed -i "s|ENV_TAG|Stable|g"             $(Pipeline.Workspace)/k8s/configmap.yaml

                echo "→ Verificando substituições:"
                grep "namespace:"  $(Pipeline.Workspace)/k8s/deployment.yaml
                grep "image:"      $(Pipeline.Workspace)/k8s/deployment.yaml
                grep "ASPNETCORE_ENVIRONMENT" $(Pipeline.Workspace)/k8s/configmap.yaml

          - task: AzureCLI@2
            displayName: '3. Apply manifests + rollout (stable)'
            inputs:
              azureSubscription: 'sc-azure-pedidosapi'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az aks get-credentials \
                  --resource-group $(AKS_RESOURCE_GROUP) \
                  --name $(AKS_CLUSTER) \
                  --overwrite-existing

                echo "→ Aplicando manifests em ordem no namespace stable..."
                kubectl apply -f $(Pipeline.Workspace)/k8s/configmap.yaml  -n stable
                kubectl apply -f $(Pipeline.Workspace)/k8s/deployment.yaml -n stable
                kubectl apply -f $(Pipeline.Workspace)/k8s/service.yaml    -n stable
                kubectl apply -f $(Pipeline.Workspace)/k8s/hpa.yaml        -n stable

                echo "→ Aguardando rollout..."
                kubectl rollout status deployment/$(K8S_DEPLOYMENT) \
                  -n stable --timeout=180s

          - task: AzureCLI@2
            displayName: '4. Smoke test Stable'
            inputs:
              azureSubscription: 'sc-azure-pedidosapi'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az aks get-credentials \
                  --resource-group $(AKS_RESOURCE_GROUP) \
                  --name $(AKS_CLUSTER) \
                  --overwrite-existing

                sleep 10
                SVC_IP=$(kubectl get svc pedidosapi-svc -n stable \
                  -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
                echo "Service IP: $SVC_IP"
                STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://$SVC_IP/info)
                echo "Smoke test Stable: HTTP $STATUS"
                [ "$STATUS" = "200" ] && echo "✅ Stable — produção no ar!" || exit 1

          - script: |
              echo "================================================"
              echo " Deploy em produção concluído!"
              echo " Versão : $(appVersion)"
              echo " Imagem : $(DOCKERHUB_REPO):$(appVersion)"
              echo " Cluster: $(AKS_CLUSTER)"
              echo " NS     : stable"
              echo "================================================"
            displayName: '5. Resumo do deploy'
