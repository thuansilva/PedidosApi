# ============================================================
#  PedidosApi — Pipeline CI/CD com Docker + ACR + Web App Container
#  Alpha → Beta → RC → Stable
#
#  Diferenças em relação ao azure-pipelines.yml (zip):
#    CI  : dotnet publish ocorre DENTRO do Docker (build multi-stage)
#           com version via --build-arg; imagem enviada ao ACR
#    CD  : AzureWebAppContainer@1 em vez de AzureWebApp@1
#           ASPNETCORE_ENVIRONMENT definido como App Setting no deploy
#
#  Triggers por tag SemVer:
#    v*.*.*-alpha.*  → CI + Deploy Alpha
#    v*.*.*-beta.*   → CI + Deploy Beta
#    v*.*.*-rc.*     → CI + Deploy RC  (aprovação: Tech Lead)
#    v*.*.*          → CI + Deploy Stable (aprovação: Tech Lead + PM)
#
#  Pré-requisitos no Azure DevOps:
#    Service connections:
#      sc-acr-pedidosapi   → Azure Container Registry (tipo Docker Registry)
#      sc-azure-pedidosapi → Azure Resource Manager (para Web App)
#    Environments:
#      alpha, beta, rc, stable  (mesmos do pipeline zip)
#    ACR:
#      Criar em Portal → Container registries → <ACR_NAME>
#      Web App Container: configurar para pull do ACR com Managed Identity
# ============================================================

trigger:
  branches:
    include:
      - main
      - 'feat/*'
      - 'fix/*'
  tags:
    include:
      - 'v*.*.*'

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'
  dotnetVersion:      '10.x'
  ACR_NAME:           'pedidosregistry'
  IMAGE_NAME:         'pedidosapi'
  ACR_LOGIN_SERVER:   '$(ACR_NAME).azurecr.io'
  APP_NAME_ALPHA:     'pedidos-api-curso-devops-alpha'
  APP_NAME_BETA:      'pedidos-api-curso-devops-beta'
  APP_NAME_RC:        'pedidos-api-curso-devops-rc'
  APP_NAME_STABLE:    'pedidos-api-curso-devops'

stages:

# ── CI ────────────────────────────────────────────────────────
- stage: CI
  displayName: 'CI — Build, Test e Push ACR'
  jobs:
  - job: BuildTestPush
    displayName: 'Build, Test e Push para ACR'
    steps:

    - checkout: self
      fetchDepth: 0

    - task: UseDotNet@2
      displayName: '1. Instalar .NET SDK $(dotnetVersion)'
      inputs:
        version: '$(dotnetVersion)'
        includePreviewVersions: true

    - script: |
        BRANCH="$(Build.SourceBranch)"
        if [[ "$BRANCH" == refs/tags/v* ]]; then
          VERSION="${BRANCH#refs/tags/v}"
          ASSEMBLY_VERSION=$(echo "$VERSION" | cut -d'-' -f1)
        else
          VERSION="0.0.0-$(Build.BuildNumber)"
          ASSEMBLY_VERSION="0.0.0"
        fi

        if [[ "$BRANCH" == refs/heads/main ]] || [[ "$VERSION" == *-alpha.* ]]; then
          ENV_TAG="alpha"
        elif [[ "$VERSION" == *-beta.* ]]; then
          ENV_TAG="beta"
        elif [[ "$VERSION" == *-rc.* ]]; then
          ENV_TAG="rc"
        else
          ENV_TAG="stable"
        fi

        echo "##vso[task.setvariable variable=appVersion;isOutput=true]$VERSION"
        echo "##vso[task.setvariable variable=assemblyVersion]$ASSEMBLY_VERSION"
        echo "##vso[task.setvariable variable=envTag;isOutput=true]$ENV_TAG"
        echo "Versão: $VERSION | Assembly: $ASSEMBLY_VERSION | Tag: $ENV_TAG"
      name: versao
      displayName: '2. Calcular versão SemVer e tag de ambiente'

    - task: DotNetCoreCLI@2
      displayName: '3. Restaurar pacotes NuGet'
      inputs:
        command: restore
        projects: '**/*.csproj'

    - task: DotNetCoreCLI@2
      displayName: '4. Build'
      inputs:
        command: build
        projects: '**/*.csproj'
        arguments: >
          --configuration $(buildConfiguration)
          --no-restore
          -p:Version=$(assemblyVersion)
          -p:AssemblyVersion=$(assemblyVersion)
          -p:FileVersion=$(assemblyVersion)
          -p:InformationalVersion=$(versao.appVersion)
          -p:IncludeSourceRevisionInInformationalVersion=false

    - task: DotNetCoreCLI@2
      displayName: '5. Testes unitários com cobertura'
      inputs:
        command: test
        projects: '**/*Tests*.csproj'
        arguments: >
          --configuration $(buildConfiguration)
          --no-build
          --collect:"XPlat Code Coverage"
        publishTestResults: true

    - task: Docker@2
      displayName: '6. Build e Push da imagem para o ACR'
      inputs:
        command: buildAndPush
        containerRegistry: 'sc-acr-pedidosapi'
        repository: '$(IMAGE_NAME)'
        dockerfile: 'Dockerfile'
        buildContext: '.'
        tags: |
          $(versao.appVersion)
          $(versao.envTag)
        arguments: >
          --build-arg VERSION=$(versao.appVersion)
          --build-arg ASSEMBLY_VERSION=$(assemblyVersion)

# ── ALPHA ─────────────────────────────────────────────────────
- stage: DeployAlpha
  displayName: 'Alpha — Deploy automático'
  dependsOn: CI
  condition: >
    and(
      succeeded(),
      or(
        eq(variables['Build.SourceBranch'], 'refs/heads/main'),
        contains(variables['Build.SourceBranch'], '-alpha.')
      )
    )
  variables:
    appVersion: $[ stageDependencies.CI.BuildTestPush.outputs['versao.appVersion'] ]
  jobs:
  - deployment: DeployAlpha
    displayName: 'Deploy Alpha'
    environment: 'alpha'
    strategy:
      runOnce:
        deploy:
          steps:
          - script: echo "appVersion=$(appVersion)" 
            displayName: '0. Debug appVersion'
          - task: AzureWebAppContainer@1
            displayName: '1. Deploy Web App Container Alpha'
            inputs:
              azureSubscription: 'sc-azure-pedidosapi'
              appName: '$(APP_NAME_ALPHA)'
              containers: '$(ACR_LOGIN_SERVER)/$(IMAGE_NAME):$(appVersion)'
              appSettings: -ASPNETCORE_ENVIRONMENT Alpha

          - script: |
              sleep 20
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                https://$(APP_NAME_ALPHA)-hbdpfdc7dhgmbscv.canadacentral-01.azurewebsites.net/info)
              echo "Smoke test Alpha: $STATUS"
              [ "$STATUS" = "200" ] && echo "OK" || exit 1
            displayName: '2. Smoke test Alpha'

# ── BETA ──────────────────────────────────────────────────────
- stage: DeployBeta
  displayName: 'Beta — Deploy automático'
  dependsOn: CI
  condition: >
    and(
      succeeded(),
      contains(variables['Build.SourceBranch'], '-beta.')
    )
  variables:
    appVersion: $[ stageDependencies.CI.BuildTestPush.outputs['versao.appVersion'] ]
  jobs:
  - deployment: DeployBeta
    displayName: 'Deploy Beta'
    environment: 'beta'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebAppContainer@1
            displayName: '1. Deploy Web App Container Beta'
            inputs:
              azureSubscription: 'sc-azure-pedidosapi'
              appName: '$(APP_NAME_BETA)'
              containers: '$(ACR_LOGIN_SERVER)/$(IMAGE_NAME):$(appVersion)'
              appSettings: -ASPNETCORE_ENVIRONMENT Beta

          - script: |
              sleep 20
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                https://$(APP_NAME_BETA)-bbbgc9e8bsfafzf7.canadacentral-01.azurewebsites.net/info)
              echo "Smoke test Beta: $STATUS"
              [ "$STATUS" = "200" ] && echo "OK" || exit 1
            displayName: '2. Smoke test Beta'

# ── RC ────────────────────────────────────────────────────────
- stage: DeployRC
  displayName: 'RC — Aprovação obrigatória'
  dependsOn: CI
  condition: >
    and(
      succeeded(),
      contains(variables['Build.SourceBranch'], '-rc.')
    )
  variables:
    appVersion: $[ stageDependencies.CI.BuildTestPush.outputs['versao.appVersion'] ]
  jobs:
  - deployment: DeployRC
    displayName: 'Deploy RC'
    environment: 'rc'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebAppContainer@1
            displayName: '1. Deploy Web App Container RC'
            inputs:
              azureSubscription: 'sc-azure-pedidosapi'
              appName: '$(APP_NAME_RC)'
              containers: '$(ACR_LOGIN_SERVER)/$(IMAGE_NAME):$(appVersion)'
              appSettings: -ASPNETCORE_ENVIRONMENT RC

          - script: |
              sleep 20
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                https://$(APP_NAME_RC)-a3gqd4ctgpbmb7gf.canadacentral-01.azurewebsites.net/info)
              echo "Smoke test RC: $STATUS"
              [ "$STATUS" = "200" ] && echo "OK" || exit 1
            displayName: '2. Smoke test RC'

# ── STABLE ────────────────────────────────────────────────────
- stage: DeployStable
  displayName: 'Stable — Produção (aprovação dupla)'
  dependsOn: CI
  condition: >
    and(
      succeeded(),
      startsWith(variables['Build.SourceBranch'], 'refs/tags/v'),
      not(contains(variables['Build.SourceBranch'], '-alpha.')),
      not(contains(variables['Build.SourceBranch'], '-beta.')),
      not(contains(variables['Build.SourceBranch'], '-rc.'))
    )
  variables:
    appVersion: $[ stageDependencies.CI.BuildTestPush.outputs['versao.appVersion'] ]
  jobs:
  - deployment: DeployStable
    displayName: 'Deploy Stable'
    environment: 'stable'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebAppContainer@1
            displayName: '1. Deploy Web App Container Stable'
            inputs:
              azureSubscription: 'sc-azure-pedidosapi'
              appName: '$(APP_NAME_STABLE)'
              containers: '$(ACR_LOGIN_SERVER)/$(IMAGE_NAME):$(appVersion)'
              appSettings: -ASPNETCORE_ENVIRONMENT Stable

          - script: |
              sleep 25
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                https://$(APP_NAME_STABLE)-hdaebhgzbxdxajdw.canadacentral-01.azurewebsites.net/info)
              echo "Smoke test Stable: $STATUS"
              [ "$STATUS" = "200" ] && echo "OK — produção no ar!" || exit 1
            displayName: '2. Smoke test Stable'

          - script: |
              echo "================================================"
              echo " Deploy em produção concluído!"
              echo " Versão : $(appVersion)"
              echo " Imagem : $(ACR_LOGIN_SERVER)/$(IMAGE_NAME):$(appVersion)"
              echo " URL    : https://$(APP_NAME_STABLE)-hdaebhgzbxdxajdw.brazilsouth-01.azurewebsites.net"
              echo "================================================"
            displayName: '3. Resumo do deploy'
